services:
  app:
    build: .docker
    stdin_open: true
    tty: true
    container_name: app.Proiect_An_Vue_API
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      CHOKIDAR_USEPOLLING: true
      CHOKIDAR_INTERVAL: 100
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3001}
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.git/
    working_dir: /app
    user: root

  api:
    build: .docker/api
    stdin_open: true
    tty: true
    container_name: api.Proiect_An_Vue_API
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      CHOKIDAR_USEPOLLING: true
      CHOKIDAR_INTERVAL: 100
      API_PORT: ${API_PORT:-3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DB_HOST: ${DB_HOST:-mysql.Proiect_An_Vue_API}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-Proiect_An_Vue_API}
      DB_USER: ${DB_USER:-Proiect_An_Vue_API}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - "3000:3000"
    volumes:
      - ./api:/api
    working_dir: /api
    user: 1000:1000
    depends_on:
      - mysql

  ws:
    build: .docker/ws
    stdin_open: true
    tty: true
    container_name: ws.Proiect_An_Vue_API
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      CHOKIDAR_USEPOLLING: true
      CHOKIDAR_INTERVAL: 100
      WS_PORT: ${WS_PORT:-3001}
    ports:
      - "3001:3001"
    volumes:
      - ./ws:/ws
    working_dir: /ws
    user: 1000:1000

  mysql:
    image: mysql:8.0.40
    container_name: mysql.Proiect_An_Vue_API
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-Proiect_An_Vue_API}
      MYSQL_USER: ${MYSQL_USER:-Proiect_An_Vue_API}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./.docker/mysql/utf8mb4.cnf:/etc/mysql/conf.d/utf8mb4.cnf:ro
      - ./.docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./database:/database:rw
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.1
    container_name: pma.Proiect_An_Vue_API
    ports:
      - "8080:80"
    environment:
      PMA_HOST: ${DB_HOST:-mysql.Proiect_An_Vue_API}
      PMA_USER: ${MYSQL_USER:-Proiect_An_Vue_API}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: 250M
    depends_on:
      - mysql
    restart: always

volumes:
  mysql_data:
    driver: local
